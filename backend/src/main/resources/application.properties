# Nombre de la aplicacion
spring.application.name=backend-botica

# Puerto donde escucha el servidor
server.port=8080
# Conexion a SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=bd_boticas_familia_salud;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# =============================================================
# JPA/Hibernate - valores de desarrollo
# =============================================================
# update: Hibernate crea o actualiza unicamente las tablas de las entidades
# definidas (roles y usuarios). No usar create ni create-drop.
spring.jpa.hibernate.ddl-auto=update

# Muestra el SQL generado por Hibernate (util durante el desarrollo).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =============================================================
# Seguridad (JWT + BCrypt)
app.seguridad.secreto=${APP_SEGURIDAD_SECRETO:clave-local-academica-no-usar-en-produccion}
app.seguridad.expiracion-minutos=480

# Origenes permitidos para CORS (desarrollo).
# Se mantiene un patron limitado para los túneles temporales de ngrok
# (https://*.ngrok-free.dev); no se usa "*" para no abrir la API.
app.seguridad.origenes-permitidos=http://localhost:8080,http://127.0.0.1:8080,http://localhost:5500,http://127.0.0.1:5500,https://serpent-childhood-stainless.ngrok-free.dev,https://*.ngrok-free.dev
